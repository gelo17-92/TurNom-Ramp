<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR / WebSocket errors in cloud iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function ViteHmrStub(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && url.includes('vite-hmr'));

            if (isViteHmr) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url || '');
              target.send = function() {};
              target.close = function() {};
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              return target;
            }
            return Reflect.construct(RealWebSocket, arguments, ViteHmrStub);
          }
          ViteHmrStub.prototype = RealWebSocket.prototype;
          ViteHmrStub.CONNECTING = 0;
          ViteHmrStub.OPEN = 1;
          ViteHmrStub.CLOSING = 2;
          ViteHmrStub.CLOSED = 3;
          window.WebSocket = ViteHmrStub;
        }

        var isWsOrViteError = function(val) {
          if (!val) return false;
          var str = (typeof val === 'string' ? val : (val.message || String(val)));
          return str.includes('WebSocket') || str.includes('[vite]') || str.includes('connection lost');
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsOrViteError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsOrViteError(event.message) || isWsOrViteError(event.error) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsOrViteError(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TurNom Ramp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TurNom Ramp" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
