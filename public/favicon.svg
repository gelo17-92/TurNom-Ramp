<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo con degradado sofisticado usando los colores de la marca -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F5C" />
      <stop offset="60%" stop-color="#003399" />
      <stop offset="100%" stop-color="#004AD6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE14D" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base redondeada estilo iOS/Android con los colores de la marca -->
  <rect width="480" height="480" x="16" y="16" rx="108" fill="url(#blueGrad)" filter="url(#glow)" />

  <!-- Detalles de contorno sutiles de seguridad y calidad -->
  <rect width="440" height="440" x="36" y="36" rx="88" fill="none" stroke="rgba(255, 215, 0, 0.12)" stroke-width="3" />
  
  <!-- Grupo del Emblema Central (Fusión de Calendario de Turnos + Nómina) -->
  <g transform="translate(116, 122)" filter="url(#softShadow)">
    <!-- Cuerpo de la Nómina / Billete -->
    <rect x="0" y="24" width="280" height="172" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="16" />
    
    <!-- Elemento Central Estilizado (Moneda / Detalle Holográfico) -->
    <circle cx="140" cy="110" r="40" fill="url(#goldGrad)" />
    <!-- Círculo interior calado para contraste elegante -->
    <circle cx="140" cy="110" r="16" fill="#003399" opacity="0.9" />
    
    <!-- Puntos de Seguridad / Turnos Registrados -->
    <circle cx="54" cy="110" r="12" fill="url(#goldGrad)" />
    <circle cx="226" cy="110" r="12" fill="url(#goldGrad)" />
    
    <!-- Cabecera del Calendario de Turnos -->
    <path d="M 30 -6 L 250 -6" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Enganches del Calendario / Pestañas de Registro de Jornada -->
    <rect x="68" y="-18" width="16" height="24" rx="4" fill="url(#goldGrad)" />
    <rect x="196" y="-18" width="16" height="24" rx="4" fill="url(#goldGrad)" />
  </g>
</svg>
